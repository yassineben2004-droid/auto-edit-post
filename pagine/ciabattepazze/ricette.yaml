# Ricette reel Ciabatte Pazze — si montano su Mac con il workflow "Monta reel" (emoji iOS)
# Clip in clip_originali/ciabattepazze/ (+ ../ciabattepazze_regalo e ../ciabattepazze_39anni):
#   p1_pov_ingresso p2_nonna_paste p3_zio_vino p4_cuginetto p5_mamma_famiglia   (pranzo domenica)
#   m1_pov_camera m2_zia_cappello m3_navata_nonno m4_firma_sposi                  (matrimonio)
#   r1_pov_casa r2_supermercato r3_bar r4_posta                                   (quartiere)
#   ../ciabattepazze_regalo/v1_regalo v2_prova v3_cucina v4_strada                (papà a Natale)
#   ../ciabattepazze_39anni/v1_corsia v2_scaffale v3_casa                         (lei al negozio)
# cp01-cp17 già montati e pubblicati/in coda: qui da cp18 in poi, hook NUOVI (leva: nuovo angolo).
# Testo a 0.58: a metà-basso (gambe/pavimento in tutte le clip), le ciabatte restano visibili sotto, nessuna banda.
# Dove c'è `cta`, negli ultimi 3s il punchline SOSTITUISCE l'hook alla stessa altezza.
reel:
