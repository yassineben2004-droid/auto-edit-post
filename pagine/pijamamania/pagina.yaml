# Pagina: PijamaMania
nome: "PijamaMania"
attiva: true
ig_user_id: "17841428063511900"         # @pijamamania.it
token_env: TOKEN_META             # nome del secret con il token (uno solo per tutte le pagine dello stesso portfolio)
anche_nel_feed: true
elimina_dopo: true                # cancella il video dopo averlo pubblicato

# ORARI FISSI (ora italiana). A ogni orario esce il prossimo video della coda.
# 10 post al giorno, almeno 1h30 di distanza, più fitti la sera (orari di picco).
orari:
  ogni_giorno: ["08:00", "09:45", "11:30", "13:00", "14:45", "16:30", "18:00", "19:30", "21:00", "22:30"]
  # per giorni diversi basta aggiungere il giorno (sostituisce ogni_giorno quel giorno):
  # sabato: ["10:00", "13:00", "18:00", "21:30"]

# Hashtag aggiunti in fondo a ogni caption (generici, quelli per-prodotto sono nel coda.csv)
# ANCHE SU FACEBOOK: lo stesso reel esce anche come Reel sulla Pagina Facebook collegata (4 dei 10 turni (su FB 10 al giorno sembrano spam)).
# Serve il permesso pages_manage_posts sul token. Se Facebook fallisce, Instagram esce lo stesso.
facebook:
  attivo: false   # disattivato 16/11/2026: la Pagina FB non è nel portafoglio del token, per ora solo Instagram
  fb_page_id: "583107068221301"
  orari: ["09:45", "13:00", "18:00", "21:00"]

caption_cta:                      # caption = CTA diretta, per prodotto (prefisso del nome del reel montato)
  sq: "Link in Bio o Commenta SQUALO per ricevere l'offerta 🦈"
  bb: "Link in Bio o Commenta PANCIA per ricevere l'offerta 🍺"
  ch: "Link in Bio o Commenta STIVALI per ricevere l'offerta 👢"
  gr: "Link in Bio o Commenta GRINCH per ricevere l'offerta 💚"
  pp: "Link in Bio o Commenta POWERPUFF per ricevere l'offerta 💖"
  dk: "Link in Bio o Commenta PAPERA per ricevere l'offerta 🦆"
  tart: "Link in Bio o Commenta TARTARUGA per ricevere l'offerta 🐢"
  demo: "Link in Bio o Commenta DEMOGORGONE per ricevere l'offerta 👹"
  stitch: "Link in Bio o Commenta STITCH per ricevere l'offerta 💙"
  dt: "Link in Bio o Commenta DRAGO per ricevere l'offerta 🐉"
  bg: "Link in Bio o Commenta GIRLY per ricevere l'offerta 💖"
  rana: "Link in Bio o Commenta RANA per ricevere l'offerta 🐸"
  altro: "Link in Bio o Commenta REGALO per ricevere l'offerta 🎁"

hashtag: "#regalodinatale #ideeregalo #natale2026 #pijamamania #perte"

# Caption a rotazione multi-prodotto (una diversa per ogni post, poi ricomincia)
# Le caption specifiche per-video sono nel coda.csv; queste sono il fallback
caption:
  # Squalo
  - "Pensavo fosse un regalo simpatico… ora non me la ridà più 😂🦈\nLa trovi su pijamamania.it (link in bio)"
  - "Tagga chi deve ricevere questa coperta squalo a Natale 🎁🦈"
  - "Calda, morbida e ridicola al punto giusto 🦈\nLink in bio"
  - "Avvisate i fidanzati: dopo questa non esce più di casa 😂🦈"
  # Beer Belly
  - "Il regalo più assurdo di Natale 😂🍺 Marsupio pancia finta su pijamamania.it"
  - "POV: arrivi alla festa con il marsupio pancia 😂 Link in bio"
  # Christmas Heels
  - "Gli stivali che illuminano il Natale ✨👢 Link in bio"
  - "Stivali natalizi LED: brillano al buio! ✨ pijamamania.it"
  # Grinch
  - "Vestaglia riscaldata Grinch 💚 Il Grinch approva! Link in bio"
  - "Quando fa freddo ma hai la vestaglia Grinch 💚 pijamamania.it"
  # Powerpuff Girls
  - "Pigiama Powerpuff Girls 💖💙💚 Superpoteri attivati! Link in bio"
  - "Il regalo perfetto per le vere Superchicche 💖 pijamamania.it"
  # Pijama Duck
  - "Pigiami anatra di coppia 🦆🖤 Troppo teneri! Link in bio"
  - "POV: il tuo pigiama anatra ti aspetta dopo la doccia 🦆😂"
  # Cuscino Tartaruga
  - "Cuscino tartaruga gigante 🐢 Troppo morbido! Link in bio"
  # Dragon Trainer
  - "Pigiama Sdentato 🐉 Dragon Trainer approva! pijamamania.it"

# AUDIO INSERITI NEI VIDEO (cartella audio/, comando metti-audio). Sono quelli che si sentono davvero.
# pesi: un audio con peso 3 esce 3 volte più spesso degli altri (default 1)
audio_inseriti:
  pesi:
    VIRALE_squalo_3M6.mp3: 20     # audio del reel squalo da 3,6M views: circa 1 video su 2 (mai due di fila), anche con la libreria comune più grande

# Musica di tendenza di Meta: SPENTA (il 27/10 Meta l'ha ignorata e coprirebbe l'audio inserito)
audio:
  attivo: false
  tipo: music                     # music | original_sound
  ricerca: []                     # vuoto = TENDENZA; es. ["natale", "christmas"]
  tra_i_primi: 5
  no_ripetere_ultimi: 10
  volume_audio: 100
  volume_video: 1
  vietati: []
  pubblica_senza_audio: false
