# Pagina: AfterShift (account IG ex Raven & Resin by Cole, ripulito) (brand worldwide in inglese, nicchia: chi lavora in piedi tutto il giorno)
# Primo prodotto: massaggiatore riscaldato per caviglia (angoli parrucchiera e magazzino)
nome: "AfterShift"
attiva: true
ig_user_id: "17841429655295961"   # @shop.aftershift
token_env: TOKEN_META_STORE        # token del portafoglio Business del profilo personale (tutti gli store tranne PijamaMania)
anche_nel_feed: true
elimina_dopo: true

# ORARI FISSI (ora italiana) pensati per gli USA:
# 14:30 = mattina East Coast, 19:30 = pranzo/pausa, 01:30 = sera dopo il turno East Coast / pomeriggio West Coast
orari:
  ogni_giorno: ["14:30", "19:30", "01:30"]

# ANCHE SU FACEBOOK: lo stesso reel esce anche come Reel sulla Pagina Facebook collegata.
facebook:
  attivo: true
  fb_page_id: "1465124596678386"   # Pagina FB AfterShift
  orari: "tutti"

hashtag: "#aftershift #onyourfeetallday #hairstylist #warehouseworker #nurselife #giftideas #christmasgift #selfcare"

# Caption = CTA a commento (lo store non c'e' ancora: si risponde a mano col link quando e' pronto)
caption_cta: "Comment SHIFT and I'll send you the link 🎁🦶"

# Caption a rotazione (usate solo se caption_cta manca)
caption:
  - "For the ones who never sit down 🦶✨ Comment SHIFT for the link"
  - "Tag someone who's on their feet all day 👇"

# AUDIO INSERITI NEI VIDEO (cartella audio/, comando metti-audio)
audio_inseriti:
  comuni: false                   # pagina in inglese: niente libreria audio comune italiana
  pesi: {"Df1rf6GtDi_.m4a": 6}   # audio del virale alldaylegs.co (Christmas)

# Musica di tendenza di Meta: spenta come sulle altre pagine (copre l'audio inserito)
audio:
  attivo: false
  tipo: music
  ricerca: []
  tra_i_primi: 5
  no_ripetere_ultimi: 10
  volume_audio: 100
  volume_video: 1
  vietati: []
  pubblica_senza_audio: false
