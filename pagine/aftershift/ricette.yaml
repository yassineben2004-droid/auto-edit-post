# Ricette dei reel AfterShift — si montano su Mac con il workflow "Monta reel" (emoji iOS)
# Clip in clip_originali/aftershift/ (reel completi clean, fatti su Higgsfield, struttura del virale alldaylegs.co):
#   a1_stylist_v1     parrucchiera, prima animazione raggi X (15.1s)
#   a2_stylist_v2     parrucchiera, animazione raggi X corretta (15.6s)
#   b1_warehouse_v1   magazzino, prima animazione raggi X (15.1s)
#   b2_warehouse_v2   magazzino, animazione raggi X corretta (15.6s)
# Split test sul text hook: le v2 hanno 5 varianti, le v1 3 varianti con testi diversi.
# Hook a 0.58 (piu in basso, come nei reel nativi). CTA negli ultimi 3s: commento SHIFT (store non ancora pronto, si risponde a mano col link).
