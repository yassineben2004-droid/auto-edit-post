name: Scarica clip
# Scarica le clip originali elencate in clip_originali/<brand>/sorgenti.txt (formato: nome_file url)
on:
  push:
    paths: ["clip_originali/**/sorgenti.txt"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scarica-clip
  cancel-in-progress: false
jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Scarica
        run: |
          for f in clip_originali/*/sorgenti.txt; do
            d=$(dirname "$f")
            grep -v '^#' "$f" | while read -r nome url; do
              [ -z "$nome" ] && continue
              [ -s "$d/$nome" ] && continue
              curl -fsSL --retry 3 -o "$d/$nome" "$url" && echo "ok $d/$nome" || echo "ERRORE $d/$nome"
            done
          done
      - name: Salva
        if: always()
        run: |
          git config user.name "auto-edit-post"
          git config user.email "auto-edit-post@users.noreply.github.com"
          git add -A clip_originali
          git diff --cached --quiet || (git commit -m "clip scaricate" && git pull --rebase && git push)
