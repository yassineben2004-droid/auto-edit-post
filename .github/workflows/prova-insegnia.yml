name: Verifica pagina (solo lettura)
on:
  push:
    branches: [main]
    paths: [".github/workflows/prova-insegnia.yml", "verifica_pagina.py"]
  workflow_dispatch:
concurrency:
  group: pubblica
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verifica Insegnia
        env:
          SEGRETI: ${{ toJSON(secrets) }}
        run: python verifica_pagina.py insegnia
      - name: Salva esito
        if: always()
        run: |
          git config user.name "auto-edit-post"
          git config user.email "auto-edit-post@users.noreply.github.com"
          git add pagine/_prova_*.txt
          git diff --cached --quiet || (git commit -m "verifica insegnia $(date -u +%F' '%H:%M)" && git pull --rebase && git push)
