name: Scarica audio
on:
  workflow_dispatch:
    inputs:
      pagina:
        description: "pagina (es. pijamamania)"
        required: true
        default: "pijamamania"
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # SEMPRE l'ultima versione: un run in coda deve vedere lo stato salvato dal run precedente
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q -U yt-dlp
      - run: python scarica_audio.py ${{ github.event.inputs.pagina }}
      - name: Salva
        if: always()
        run: |
          git config user.name "auto-edit-post"
          git config user.email "auto-edit-post@users.noreply.github.com"
          git add -A pagine
          git diff --cached --quiet || (git commit -m "audio scaricati" && git pull --rebase && git push)
