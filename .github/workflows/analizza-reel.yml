name: Analizza reel
# Scarica i reel dai link e scrive analisi/<id>/report.md (tutto in testo, gratis).
# Avvio: Actions → Analizza reel → Run workflow, incolla uno o più link separati da spazio.
on:
  workflow_dispatch:
    inputs:
      link:
        description: "link dei reel (separati da spazio). Vuoto = analisi/link.txt"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  analizza:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # SEMPRE l'ultima versione: un run in coda deve vedere lo stato salvato dal run precedente
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-ita
      - run: pip install -q -U yt-dlp faster-whisper numpy
      - run: python analizza_reel.py ${{ github.event.inputs.link }}
      - name: Salva
        if: always()
        run: |
          git config user.name "auto-edit-post"
          git config user.email "auto-edit-post@users.noreply.github.com"
          git add -A analisi
          git diff --cached --quiet || (git commit -m "analisi reel" && git pull --rebase && git push)
