# Parti sgranate / scritte residue nelle clip di PijamaMania (controllate a mano il 19/11/2026 con controlla_clip.py)
# monta.py mette il testo del reel SOPRA queste parti in automatico (anche se la ricetta dice altra posizione).
#   y:         centro della parte sgranata, in frazione dell'altezza del reel (0 = in cima, 1 = in fondo)
#   altezza:   quanto è spessa (frazione dell'altezza)            — facoltativo, default 0.05
#   larghezza: quanto è larga (frazione della larghezza)          — facoltativo, serve al testo evidenziato
#   forte:     true = si vede molto → testo EVIDENZIATO (riquadro bianco, scritta nera) per coprirla bene.
#              Scritte ed emoji residue sono SEMPRE forte: col testo normale spuntano fra le parole.
#              Senza forte (solo macchie sfocate leggere) il testo normale ci passa sopra.
#   da / a:    secondi della clip in cui c'è (se manca: per tutta la clip)
# Le clip Higgsfield (bb_, ch2_, gr_, pp_) non hanno sgranature e non sono elencate.

dk_01:
  - {y: 0.47, altezza: 0.04, larghezza: 0.60, forte: true, da: 0, a: 4.0}        # scritta "Matching Duck pajamas >>" rimasta
